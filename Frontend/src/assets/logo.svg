<svg viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ticket: rettangolo con dentini a sinistra e a destra -->
    <g id="Ticket">
      <path
        d="M10 10 H90
           l2 2.5 l-2 2.5 l2 2.5 l-2 2.5 l2 2.5 l-2 2.5 l2 2.5 l-2 2.5 l2 2.5 l-2 2.5
           l2 2.5 l-2 2.5 l2 2.5 l-2 2.5 l2 2.5 l-2 2.5 l2 2.5 l-2 2.5 l2 2.5 l-2 2.5
           V60 H10
           l-2 -2.5 l2 -2.5 l-2 -2.5 l2 -2.5 l-2 -2.5 l2 -2.5 l-2 -2.5 l2 -2.5 l-2 -2.5 l2 -2.5
           l-2 -2.5 l2 -2.5 l-2 -2.5 l2 -2.5 l-2 -2.5 l2 -2.5 l-2 -2.5 l2 -2.5 l-2 -2.5 l2 -2.5
           Z"
        fill="#0b1120"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linejoin="round"
      />
      <!-- riquadro interno -->
      <rect x="15" y="15" width="70" height="40" rx="4"
            stroke="currentColor" stroke-width="1.5" opacity="0.7" />
      <!-- linea del numero -->
      <path d="M70 15 V55" stroke="currentColor" stroke-width="1.5" opacity="0.7" />
    </g>
  </defs>

  <!-- Ticket dietro (ruotato di più) -->
  <g transform="translate(18 -4) rotate(-24 50 35)">
    <use href="#Ticket" />
  </g>

  <!-- Ticket in mezzo -->
  <g transform="translate(14 8) rotate(-12 50 35)">
    <use href="#Ticket" />
  </g>

  <!-- Ticket davanti -->
  <g transform="translate(10 22)">
    <use href="#Ticket" />
    <text x="42" y="42" text-anchor="middle"
          font-family="Impact, 'Arial Black', sans-serif"
          font-size="15" font-weight="900" letter-spacing="1"
          fill="currentColor">TICKET</text>
  </g>
</svg>